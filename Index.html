<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INUZUKA · Signal Helper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:#050508;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  position:relative;overflow-y:auto;overflow-x:hidden;
  padding:20px;
}

/* ===== FOND ANIMÉ GEAR 5 STYLE (100% CSS) ===== */
.gear5-bg{
  position:fixed;inset:0;z-index:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 40%,rgba(255,215,0,.25) 0%,rgba(255,140,0,.1) 30%,transparent 60%),
    radial-gradient(circle at 20% 80%,rgba(0,150,255,.2) 0%,transparent 50%),
    radial-gradient(circle at 80% 20%,rgba(255,0,200,.15) 0%,transparent 50%),
    linear-gradient(180deg,#0a0a1a 0%,#1a0a2e 50%,#0a0a1a 100%);
}

/* Aura pulsante centrale */
.gear5-bg::before{
  content:'';
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:900px;height:900px;
  background:radial-gradient(circle,rgba(255,215,0,.4) 0%,rgba(255,140,0,.2) 25%,rgba(255,0,200,.08) 50%,transparent 70%);
  filter:blur(60px);
  animation:auraPulse 4s ease-in-out infinite;
}
@keyframes auraPulse{
  0%,100%{transform:translate(-50%,-50%) scale(.8);opacity:.6}
  50%{transform:translate(-50%,-50%) scale(1.4);opacity:1}
}

/* Rayons de lumière rotatifs */
.gear5-bg::after{
  content:'';
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:1400px;height:1400px;
  background:conic-gradient(
    from 0deg,
    transparent 0deg,
    rgba(255,215,0,.15) 10deg,
    transparent 20deg,
    transparent 40deg,
    rgba(0,200,255,.12) 50deg,
    transparent 60deg,
    transparent 80deg,
    rgba(255,0,200,.1) 90deg,
    transparent 100deg,
    transparent 170deg,
    rgba(255,215,0,.15) 180deg,
    transparent 190deg,
    transparent 220deg,
    rgba(0,200,255,.12) 230deg,
    transparent 240deg,
    transparent 300deg,
    rgba(255,0,200,.1) 310deg,
    transparent 320deg,
    transparent 360deg
  );
  animation:raysSpin 20s linear infinite;
  opacity:.7;
}
@keyframes raysSpin{
  from{transform:translate(-50%,-50%) rotate(0deg)}
  to{transform:translate(-50%,-50%) rotate(360deg)}
}

/* Éclairs bleus */
.lightning{
  position:absolute;
  width:2px;
  background:linear-gradient(180deg,transparent,#00ffff,#fff,#00ffff,transparent);
  box-shadow:0 0 20px #00ffff,0 0 40px #0088ff;
  opacity:0;
  animation:flash 3s ease-in-out infinite;
}
.lightning.l1{height:200px;top:15%;left:20%;animation-delay:0s;transform:rotate(15deg)}
.lightning.l2{height:280px;top:30%;right:15%;animation-delay:.8s;transform:rotate(-20deg)}
.lightning.l3{height:180px;bottom:25%;left:30%;animation-delay:1.6s;transform:rotate(8deg)}
.lightning.l4{height:240px;top:50%;left:70%;animation-delay:2.2s;transform:rotate(-12deg)}

@keyframes flash{
  0%,92%,100%{opacity:0}
  94%{opacity:1}
  95%{opacity:.3}
  96%{opacity:.9}
  97%{opacity:0}
}

/* Vagues d'énergie en bas */
.energy-wave{
  position:absolute;
  bottom:0;left:0;right:0;
  height:200px;
  background:
    radial-gradient(ellipse at 50% 100%,rgba(255,215,0,.3) 0%,rgba(255,140,0,.15) 30%,transparent 60%);
  filter:blur(30px);
  animation:wavePulse 3s ease-in-out infinite;
}
@keyframes wavePulse{
  0%,100%{transform:scaleY(1);opacity:.5}
  50%{transform:scaleY(1.5);opacity:.9}
}

/* Overlay léger pour lisibilité */
.bg-overlay{
  position:fixed;inset:0;z-index:1;
  background:radial-gradient(ellipse at 50% 50%,transparent 0%,rgba(0,0,0,.35) 70%,rgba(0,0,0,.6) 100%);
  pointer-events:none;
}

/* ===== PARTICULES ===== */
.particle-container{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;animation:floatParticle 16s ease-in-out infinite}
.particle.gold{width:5px;height:5px;background:#ffd700;box-shadow:0 0 25px #ffd700,0 0 50px #ff8c00}
.particle.blue{width:4px;height:4px;background:#00aaff;box-shadow:0 0 25px #00aaff,0 0 50px #0066ff}
.particle.white{width:3px;height:3px;background:#fff;box-shadow:0 0 20px #fff,0 0 40px #aaddff}
.particle.pink{width:4px;height:4px;background:#ff66cc;box-shadow:0 0 25px #ff66cc,0 0 50px #ff0066}
@keyframes floatParticle{
  0%,100%{transform:translate(0,0) scale(1);opacity:0}
  15%{opacity:1}
  85%{opacity:.6}
  100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
}
.particle:nth-child(1){--tx:320px;--ty:-220px;animation-delay:0s;left:5%;top:10%}
.particle:nth-child(2){--tx:-280px;--ty:340px;animation-delay:1.2s;left:25%;top:40%}
.particle:nth-child(3){--tx:380px;--ty:220px;animation-delay:2.4s;left:55%;top:25%}
.particle:nth-child(4){--tx:-320px;--ty:-280px;animation-delay:3.6s;left:75%;top:60%}
.particle:nth-child(5){--tx:220px;--ty:-380px;animation-delay:4.8s;left:15%;top:70%}
.particle:nth-child(6){--tx:-220px;--ty:420px;animation-delay:6s;left:45%;top:5%}
.particle:nth-child(7){--tx:420px;--ty:160px;animation-delay:7.2s;left:65%;top:50%}
.particle:nth-child(8){--tx:-380px;--ty:-320px;animation-delay:8.4s;left:35%;top:80%}
.particle:nth-child(9){--tx:260px;--ty:-300px;animation-delay:9.6s;left:85%;top:20%}
.particle:nth-child(10){--tx:-200px;--ty:340px;animation-delay:10.8s;left:50%;top:90%}

/* ===== HEADER I N U Z U K A ===== */
.hero-header{
  position:relative;z-index:10;
  width:100%;max-width:900px;
  margin:0 auto 20px;
  padding:40px 20px 30px;
  text-align:center;
}

.hero-header::before{
  content:'';
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:700px;height:350px;
  background:radial-gradient(ellipse,rgba(255,215,0,.2),rgba(0,150,255,.1),transparent 70%);
  filter:blur(50px);
  z-index:-1;
  animation:haloPulse 4s ease-in-out infinite;
}
@keyframes haloPulse{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.6}
  50%{transform:translate(-50%,-50%) scale(1.35);opacity:1}
}

.inuzuka-title{
  display:flex;justify-content:center;align-items:center;
  gap:8px;flex-wrap:wrap;
  font-family:'Courier New',monospace;
  font-size:68px;font-weight:900;letter-spacing:6px;
  margin-bottom:10px;
}

.inuzuka-title span{
  display:inline-block;
  position:relative;
  animation:letterGlow 3s ease-in-out infinite;
  transition:transform .3s;
  border:none;
  outline:none;
}
.inuzuka-title span:hover{transform:translateY(-10px) scale(1.2)}

.inuzuka-title span:nth-child(1){animation-delay:0s;color:#ffd700}
.inuzuka-title span:nth-child(2){animation-delay:.15s;color:#ff66cc}
.inuzuka-title span:nth-child(3){animation-delay:.3s;color:#00ffff}
.inuzuka-title span:nth-child(4){animation-delay:.45s;color:#c800ff}
.inuzuka-title span:nth-child(5){animation-delay:.6s;color:#ffd700}
.inuzuka-title span:nth-child(6){animation-delay:.75s;color:#ff66cc}
.inuzuka-title span:nth-child(7){animation-delay:.9s;color:#00ffff}

@keyframes letterGlow{
  0%,100%{text-shadow:0 0 25px currentColor,0 0 50px currentColor,0 0 80px currentColor;filter:brightness(1)}
  50%{text-shadow:0 0 40px currentColor,0 0 80px currentColor,0 0 140px currentColor,0 0 200px currentColor;filter:brightness(1.5)}
}

/* ===== CARTE PRINCIPALE ===== */
#main-content{
  position:relative;z-index:10;
  background:rgba(5,5,15,0.75);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-radius:32px;
  padding:40px 38px;
  max-width:760px;width:100%;
  margin:0 auto 30px;
  border:none;
  box-shadow:
    0 0 120px rgba(0,150,255,0.1),
    0 0 200px rgba(255,215,0,0.06),
    inset 0 0 80px rgba(0,100,255,0.03);
}

.badge{
  display:block;text-align:center;
  padding:10px 28px;border-radius:30px;
  font-size:12px;font-weight:700;
  letter-spacing:5px;text-transform:uppercase;
  font-family:'Courier New',monospace;
  margin-bottom:20px;
  background:rgba(255,215,0,0.12);
  color:#ffd700;
  border:none;
  animation:badgeGlow 2.5s ease-in-out infinite;
}
@keyframes badgeGlow{
  0%,100%{box-shadow:0 0 25px rgba(255,215,0,0.1)}
  50%{box-shadow:0 0 60px rgba(255,215,0,0.3)}
}

.logo-wa-container{
  display:flex;align-items:center;justify-content:center;
  gap:16px;margin-bottom:6px;
}

.wa-icon{
  width:42px;height:42px;fill:#25D366;
  filter:drop-shadow(0 0 25px rgba(37,211,102,0.5));
  animation:waPulse 2.5s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes waPulse{
  0%,100%{transform:scale(1);filter:drop-shadow(0 0 25px rgba(37,211,102,0.4))}
  50%{transform:scale(1.1);filter:drop-shadow(0 0 50px rgba(37,211,102,0.8))}
}

.main-logo{
  font-size:44px;font-weight:900;letter-spacing:12px;
  color:#fff;font-family:'Courier New',monospace;
  border:none;
  animation:logoGlow 3.5s ease-in-out infinite;
}
@keyframes logoGlow{
  0%,100%{text-shadow:0 0 50px rgba(255,215,0,0.4),0 0 100px rgba(0,150,255,0.2)}
  50%{text-shadow:0 0 80px rgba(255,215,0,0.8),0 0 160px rgba(0,150,255,0.4)}
}
.main-logo span{
  color:#ffd700;
  text-shadow:0 0 60px rgba(255,215,0,0.8),0 0 120px rgba(255,215,0,0.5);
}

.main-sub{
  text-align:center;color:#00ccff;
  font-size:12px;letter-spacing:10px;text-transform:uppercase;
  padding-bottom:18px;margin-bottom:24px;
  font-family:'Courier New',monospace;
  border:none;
  animation:subPulse 3s ease-in-out infinite;
}
@keyframes subPulse{
  0%,100%{text-shadow:0 0 30px rgba(0,200,255,0.2)}
  50%{text-shadow:0 0 70px rgba(0,200,255,0.5)}
}

/* ===== FORMULAIRE ===== */
.form-group{margin-bottom:18px;text-align:left}
.form-group label{
  color:#bbb;font-size:12px;font-weight:600;
  letter-spacing:2px;display:block;margin-bottom:8px;
  font-family:'Courier New',monospace;
  border:none;
}
.form-group input,.form-group select,.form-group textarea{
  width:100%;
  background:rgba(255,255,255,0.06);
  border:none;
  border-radius:12px;
  padding:14px 18px;
  color:#eee;font-size:15px;
  font-family:'Segoe UI',sans-serif;
  outline:none;transition:.3s;
  box-shadow:0 0 0 1px rgba(255,255,255,0.05);
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  box-shadow:0 0 0 2px rgba(0,200,255,0.4),0 0 40px rgba(0,200,255,0.15);
  transform:translateY(-2px);
  background:rgba(255,255,255,0.09);
}
.form-group select option{background:#111;color:#eee}
.form-group textarea{min-height:80px;resize:vertical}

/* ===== OUTPUT ===== */
.generated-box{
  background:rgba(0,20,40,0.6);
  border-radius:18px;
  padding:22px 24px;
  margin:20px 0;
  text-align:left;
  display:none;
  max-height:450px;overflow-y:auto;
  border:none;
  box-shadow:0 0 60px rgba(0,150,255,0.08),inset 0 0 40px rgba(0,100,255,0.03);
}
.generated-box.visible{display:block;animation:boxAppear .5s ease}
@keyframes boxAppear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.msg-title{
  color:#00ffff;font-size:11px;letter-spacing:4px;
  text-transform:uppercase;margin-bottom:12px;
  font-family:'Courier New',monospace;
  border:none;
  animation:titlePulse 2s ease-in-out infinite;
}
@keyframes titlePulse{0%,100%{opacity:.7}50%{opacity:1;text-shadow:0 0 30px rgba(0,255,255,0.5)}}

.msg-content{
  color:#e0e0e0;font-size:14px;line-height:1.9;
  white-space:pre-wrap;word-break:break-word;
  border:none;
}

/* ===== BOUTONS ===== */
.btn-group{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

.btn{
  padding:16px 32px;border:none;border-radius:50px;
  font-size:14px;font-weight:700;cursor:pointer;
  transition:.3s ease;letter-spacing:1.5px;
  flex:1 1 auto;min-width:130px;
  font-family:'Courier New',monospace;
  position:relative;overflow:hidden;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(45deg,transparent,rgba(255,255,255,0.25),transparent);
  transform:translateX(-100%);transition:.6s;
}
.btn:hover::before{transform:translateX(100%)}

.btn-generate{
  background:linear-gradient(135deg,#ffd700,#ff8c00,#ff0088);
  background-size:300% 300%;
  color:#000;
  box-shadow:0 0 50px rgba(255,215,0,0.3);
  animation:gradientShift 4s ease infinite;
}
@keyframes gradientShift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.btn-generate:hover{transform:scale(1.06);box-shadow:0 0 80px rgba(255,215,0,0.5)}
.btn-generate:disabled{opacity:.4;cursor:not-allowed;transform:none}

.btn-copy{
  background:rgba(0,200,255,0.15);color:#00ffff;
  box-shadow:0 0 30px rgba(0,200,255,0.15);
}
.btn-copy:hover{background:rgba(0,200,255,0.25);transform:scale(1.05)}
.btn-copy:disabled{opacity:.3;cursor:not-allowed;transform:none}

.btn-whatsapp{
  background:#25D366;color:#fff;
  box-shadow:0 0 40px rgba(37,211,102,0.3);
}
.btn-whatsapp:hover{background:#1da851;transform:scale(1.06)}
.btn-whatsapp:disabled{opacity:.3;cursor:not-allowed;transform:none}

.status-text{
  color:#888;font-size:12px;text-align:center;
  margin-top:12px;font-family:'Courier New',monospace;
  min-height:20px;letter-spacing:1px;
  border:none;
}

/* ===== SIGNATURE ===== */
.footer-signature{
  text-align:center;margin-top:30px;padding-top:22px;
  font-family:'Courier New',monospace;
  border:none;
  position:relative;
}
.footer-signature::after{
  content:'';position:absolute;top:0;left:50%;
  transform:translateX(-50%);width:120px;height:1px;
  background:linear-gradient(90deg,transparent,#ffd700,transparent);
  box-shadow:0 0 20px #ffd700;
}
.by-joyboy{
  font-size:28px;font-weight:900;letter-spacing:10px;
  color:#fff;text-transform:uppercase;
  display:inline-block;
  border:none;
  animation:joyboyLight 2s ease-in-out infinite;
}
@keyframes joyboyLight{
  0%,100%{text-shadow:0 0 30px rgba(255,215,0,0.6),0 0 60px rgba(255,140,0,0.3)}
  50%{text-shadow:0 0 60px rgba(255,215,0,1),0 0 120px rgba(0,200,255,0.5),0 0 200px rgba(255,0,200,0.3)}
}
.joy-span{
  color:#ffd700;
  animation:joySpan 1.2s ease-in-out infinite alternate;
}
@keyframes joySpan{
  0%{text-shadow:0 0 30px rgba(255,215,0,0.6)}
  100%{text-shadow:0 0 80px rgba(255,215,0,1),0 0 160px rgba(0,200,255,0.6)}
}

/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  background:rgba(10,10,20,0.97);backdrop-filter:blur(14px);
  border:none;
  padding:14px 34px;border-radius:40px;
  color:#eee;font-size:13px;z-index:1002;
  opacity:0;transition:.4s;pointer-events:none;
  font-family:'Courier New',monospace;
  box-shadow:0 0 60px rgba(0,200,255,0.2);
}
.toast.show{opacity:1}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
  .inuzuka-title{font-size:38px;letter-spacing:3px;gap:4px}
  #main-content{padding:24px 16px;border-radius:22px}
  .main-logo{font-size:30px;letter-spacing:8px}
  .wa-icon{width:32px;height:32px}
  .by-joyboy{font-size:20px;letter-spacing:6px}
  .btn{padding:14px 20px;font-size:12px;min-width:100px}
}
</style>
</head>
<body>

<!-- === FOND ANIMÉ GEAR 5 === -->
<div class="gear5-bg">
  <div class="lightning l1"></div>
  <div class="lightning l2"></div>
  <div class="lightning l3"></div>
  <div class="lightning l4"></div>
  <div class="energy-wave"></div>
</div>
<div class="bg-overlay"></div>

<!-- Particules -->
<div class="particle-container">
  <div class="particle gold"></div>
  <div class="particle blue"></div>
  <div class="particle white"></div>
  <div class="particle pink"></div>
  <div class="particle gold"></div>
  <div class="particle blue"></div>
  <div class="particle white"></div>
  <div class="particle gold"></div>
  <div class="particle blue"></div>
  <div class="particle pink"></div>
</div>

<!-- === HEADER I N U Z U K A === -->
<div class="hero-header">
  <div class="inuzuka-title">
    <span>I</span>
    <span>N</span>
    <span>U</span>
    <span>Z</span>
    <span>U</span>
    <span>K</span>
    <span>A</span>
  </div>
</div>

<!-- === CARTE PRINCIPALE === -->
<div id="main-content">
  <div class="badge">🛡️ SIGNAL HELPER</div>

  <div class="logo-wa-container">
    <svg class="wa-icon" viewBox="0 0 24 24">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>

  <div class="main-sub">⚡ Signal Helper ⚡</div>

  <div class="form-group">
    <label>📱 WhatsApp number concerned</label>
    <input type="text" id="numero" placeholder="+221 XX XXX XX XX">
  </div>

  <div class="form-group">
    <label>⚠️ Type of problem</label>
    <select id="type">
      <option value="scam">Scam / Fraud</option>
      <option value="harassment">Harassment</option>
      <option value="impersonation">Impersonation</option>
      <option value="threats">Threats</option>
      <option value="fraud">Financial Fraud</option>
      <option value="other">Other</option>
    </select>
  </div>

  <div class="form-group">
    <label>📝 Describe what happened (dates, content, frequency)</label>
    <textarea id="details" placeholder="Ex: Since March 12, this person keeps asking me for money..."></textarea>
  </div>

  <div class="form-group">
    <label>✍️ Your name (optional, to sign)</label>
    <input type="text" id="nom" placeholder="Your first name">
  </div>

  <div class="generated-box" id="generated-box">
    <div class="msg-title">📨 GENERATED MESSAGE</div>
    <div class="msg-content" id="message-output"></div>
  </div>

  <div class="status-text" id="status-text">Fill the form and click GENERATE</div>

  <div class="btn-group">
    <button class="btn btn-generate" id="btn-generate" onclick="startGeneration()">⚡ GENERATE</button>
    <button class="btn btn-copy" id="btn-copy" disabled onclick="copyMessage()">📋 COPY</button>
    <button class="btn btn-whatsapp" id="btn-wa" disabled onclick="sendWhatsApp()">💬 WHATSAPP</button>
  </div>

  <div class="footer-signature">
    <span class="by-joyboy">by J<span class="joy-span">O</span>Y B<span class="joy-span">O</span>Y</span>
  </div>
</div>

<script>
function buildTemplate(){
  var numero = document.getElementById('numero').value.trim() || '[number]';
  var type = document.getElementById('type').value;
  var details = document.getElementById('details').value.trim() || '[describe what happened]';
  var nom = document.getElementById('nom').value.trim() || '[your name]';

  var messages = {
    scam:
"Subject: Reporting a scam account on WhatsApp\n\n" +
"Dear WhatsApp Support Team,\n\n" +
"I'm writing to you because I've been scammed on WhatsApp and I don't know where else to turn. " +
"A user has been contacting me and others with a fake offer, asking for money and never delivering anything. " +
"I lost money I couldn't afford to lose, and I've since found out I'm not the only victim.\n\n" +
"Here's what happened:\n" + details + "\n\n" +
"The account involved is: " + numero + "\n\n" +
"I have screenshots of every conversation, the payment requests, and the fake promises. " +
"I'm ready to share all of it with you.\n\n" +
"Please, I'm asking you to investigate this account and shut it down. " +
"This person is still out there, and every day they stay active, more people will fall for it.\n\n" +
"Thank you for reading this and for taking it seriously.\n\n" +
"Sincerely,\n" + nom,

    harassment:
"Subject: Reporting harassment on WhatsApp\n\n" +
"Dear WhatsApp Support Team,\n\n" +
"I'm writing because I'm being harassed on WhatsApp and it's affecting my daily life. " +
"This person won't leave me alone, and no matter how many times I ask them to stop or block them, " +
"they keep coming back with new numbers. I'm tired, anxious, and I just want it to end.\n\n" +
"What's been happening:\n" + details + "\n\n" +
"The account is: " + numero + "\n\n" +
"I've kept every message and screenshot, and I can send them all to you.\n\n" +
"I'm not asking for much — I just want to feel safe using WhatsApp again. " +
"Please look into this account and take the necessary action.\n\n" +
"Thank you for your help.\n\n" +
"Sincerely,\n" + nom,

    impersonation:
"Subject: Someone is impersonating me on WhatsApp\n\n" +
"Dear WhatsApp Support Team,\n\n" +
"I need your help urgently. Someone has created a WhatsApp account pretending to be me. " +
"They're using my name, my photos, and messaging people I know to trick them. " +
"My reputation is being damaged, and people who trust me are being deceived.\n\n" +
"Here are the details:\n" + details + "\n\n" +
"The fake account is: " + numero + "\n\n" +
"I have proof this isn't me — screenshots, my real account details, and messages from people " +
"who were contacted by the impersonator. I'll send everything you need.\n\n" +
"Please investigate and remove this account. This person is using my identity to harm others, " +
"and I can't stop them on my own.\n\n" +
"Thank you for your time and for taking this seriously.\n\n" +
"Sincerely,\n" + nom,

    threats:
"Subject: Reporting threats and intimidation on WhatsApp\n\n" +
"Dear WhatsApp Support Team,\n\n" +
"I'm writing to report a user who has been sending me threatening messages on WhatsApp. " +
"I'm genuinely scared. This person has made it clear they want to hurt me or people close to me, " +
"and I don't know how far they'll go.\n\n" +
"What's been happening:\n" + details + "\n\n" +
"The account is: " + numero + "\n\n" +
"I have screenshots of every threat, with dates and times. " +
"I'm also planning to report this to the police, but I need WhatsApp to act on its side too.\n\n" +
"Please investigate this account and take action before something worse happens. " +
"I'm not exaggerating when I say I fear for my safety.\n\n" +
"Thank you for listening.\n\n" +
"Sincerely,\n" + nom,

    fraud:
"Subject: Reporting financial fraud on WhatsApp\n\n" +
"Dear WhatsApp Support Team,\n\n" +
"I'm writing to report a financial fraud that happened on WhatsApp. " +
"Someone contacted me through the app, gained my trust, and then convinced me to send money " +
"for something that turned out to be completely fake. I've lost money and I feel humiliated.\n\n" +
"The details:\n" + details + "\n\n" +
"The account involved is: " + numero + "\n\n" +
"I have all the evidence: the chats, the payment confirmations, the false promises. " +
"I'm ready to hand everything over.\n\n" +
"Please investigate this account. This person is a fraudster, and if nothing is done, " +
"they will keep scamming innocent people.\n\n" +
"Thank you for your help.\n\n" +
"Sincerely,\n" + nom,

    other:
"Subject: Reporting a suspicious account on WhatsApp\n\n" +
"Dear WhatsApp Support Team,\n\n" +
"I'm writing to report a user on WhatsApp whose behavior is concerning and seems to violate your terms. " +
"I've tried handling it on my own, but it's gone too far, and I need your help.\n\n" +
"Here's what's been happening:\n" + details + "\n\n" +
"The account is: " + numero + "\n\n" +
"I have screenshots and evidence I can provide.\n\n" +
"Please look into this account and take whatever action is appropriate. " +
"I just want WhatsApp to remain a safe place for everyone.\n\n" +
"Thank you for your attention.\n\n" +
"Sincerely,\n" + nom
  };

  return messages[type] || messages.other;
}

var isGenerating = false;

function startGeneration(){
  if(isGenerating) return;
  var output = document.getElementById('message-output');
  var box = document.getElementById('generated-box');
  var btnGen = document.getElementById('btn-generate');
  var btnCopy = document.getElementById('btn-copy');
  var btnWa = document.getElementById('btn-wa');
  var status = document.getElementById('status-text');

  isGenerating = true;
  btnGen.disabled = true;
  btnCopy.disabled = true;
  btnWa.disabled = true;
  status.textContent = '⏳ Generating...';
  output.textContent = '';
  box.style.display = 'block';
  box.classList.add('visible');

  var full = buildTemplate();
  var chars = full.split('');
  var i = 0;
  var txt = '';

  function step(){
    if(i < chars.length){
      txt += chars[i];
      output.textContent = txt;
      i++;
      setTimeout(step, 8 + Math.random() * 12);
    } else {
      isGenerating = false;
      btnGen.disabled = false;
      btnCopy.disabled = false;
      btnWa.disabled = false;
      status.textContent = '✅ Message ready — review and adapt before sending';
      status.style.color = '#00ffff';
      showToast('✅ Message generated');
    }
  }
  setTimeout(step, 80);
}

function copyMessage(){
  var txt = document.getElementById('message-output').textContent;
  if(!txt) return showToast('❌ Generate a message first');
  navigator.clipboard.writeText(txt).then(function(){
    showToast('📋 Copied');
  }).catch(function(){
    var a = document.createElement('textarea');
    a.value = txt;
    document.body.appendChild(a);
    a.select();
    document.execCommand('copy');
    a.remove();
    showToast('📋 Copied');
  });
}

function sendWhatsApp(){
  var txt = document.getElementById('message-output').textContent;
  if(!txt) return showToast('❌ Generate a message first');
  copyMessage();
  setTimeout(function(){
    window.open('https://wa.me/', '_blank');
  }, 400);
}

function showToast(msg){
  var t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}
</script>

</body>
</html>
